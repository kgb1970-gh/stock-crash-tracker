name: daily-stock-scan

on:
  schedule:
    # ~4:30pm ET after market close, weekdays. Cron is fixed UTC and doesn't shift
    # for daylight saving, so actual local time drifts by an hour across the year.
    - cron: '30 21 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: daily-stock-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python run_daily.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily scan: $(date -u +%Y-%m-%d)"
          git push
