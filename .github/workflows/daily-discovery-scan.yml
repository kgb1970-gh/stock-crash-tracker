name: daily-discovery-scan

on:
  schedule:
    # ~4:30pm ET after market close, weekdays. Cron is fixed UTC and doesn't shift
    # for daylight saving, so actual local time drifts by an hour across the year.
    # Runs before daily-tracker.yml (22:30 UTC) since a full-universe scan takes
    # ~30min -- separate jobs so a scanner failure never blocks the tracker update.
    - cron: '30 21 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: daily-discovery-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python scanner.py

      - name: Commit new candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/watchlist.csv data/watchlist_history.csv data/alerts.csv
          git diff --cached --quiet || git commit -m "Discovery scan: $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
