name: weekly-universe-sync

on:
  schedule:
    # Monday 10:00 UTC, before US market open -- the tradable ticker list barely
    # changes day to day, so this runs far less often than the daily scan.
    - cron: '0 10 * * 1'
  workflow_dispatch: {}

concurrency:
  group: weekly-universe-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python universe.py

      - name: Commit updated universe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tickers.csv
          git diff --cached --quiet || git commit -m "Weekly universe sync: $(date -u +%Y-%m-%d)"
          git push
